name: SDK checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every Node version on the newest Postgres, every supported Postgres on the oldest Node.
      matrix:
        node: [22, 24, 26]
        postgres: [18]
        include:
          - { node: 22, postgres: 14 }
          - { node: 22, postgres: 15 }
          - { node: 22, postgres: 16 }
          - { node: 22, postgres: 17 }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: runnerq
          POSTGRES_DB: runnerq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d runnerq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUNNERQ_TEST_DSN: postgres://postgres:runnerq@localhost:5432/runnerq_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm test
        timeout-minutes: 3
  upgrade:
    # The previous SDK version creates the schema and parks work; this one must
    # migrate it and finish all of it. See test/upgrade/run.mjs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: runnerq
          POSTGRES_DB: runnerq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d runnerq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # the previous version is built from history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:upgrade
        env:
          RUNNERQ_TEST_DSN: postgres://postgres:runnerq@localhost:5432/runnerq_test
  package:
    # What `npm publish` would upload. The version is replaced by a throwaway
    # prerelease so the dry run doesn't fail once package.json's version is on npm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:check
      - run: npm version --no-git-tag-version "$(node -p 'require("./package.json").version')-ci.${{ github.run_number }}"
      - run: npm publish --dry-run --access public --tag ci

  spec:
    # src/spec.ts, src/spec-schema.ts and src/conductor/{protocol,specs}.ts are generated
    # from the pinned runnerq-spec submodule (npm run spec:gen).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: spec/go.mod
      - run: npm run spec:gen && git diff --exit-code

  conformance:
    # runnerq-spec's cross-language scenarios, through this SDK's driver.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: runnerq
          POSTGRES_DB: runnerq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d runnerq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: spec/tools/conformance/go.mod
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: go run -C spec/tools/conformance . -v -dsn "$DSN" -driver ts="node $GITHUB_WORKSPACE/test/conformance-driver.mjs"
        env:
          DSN: postgres://postgres:runnerq@localhost:5432/runnerq_test
