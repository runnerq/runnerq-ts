name: SDK checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: runnerq
          POSTGRES_DB: runnerq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d runnerq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUNNERQ_TEST_DSN: postgres://postgres:runnerq@localhost:5432/runnerq_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm test
        timeout-minutes: 3
      - run: npm pack --dry-run
  spec:
    # src/spec.ts is generated from the pinned runnerq-spec submodule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: spec/go.mod
      - run: npm run spec:gen && git diff --exit-code
