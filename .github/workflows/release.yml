name: Release

# Publishes runnerq to npm, with provenance, when a v* tag is pushed, then
# publishes the drafted GitHub release.
# See RELEASING.md for the one-time npm setup and the release steps.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Tag must match package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run pack:check
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$dist_tag"
        env:
          # Empty once trusted publishing is configured on npmjs.com; npm then
          # authenticates with the workflow's OIDC token instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    # Turns the draft that release-drafter keeps up to date on main into the
    # published GitHub release for this tag, once the package is on npm.
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          publish: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
